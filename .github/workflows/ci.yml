name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The converter is not built here: it needs the SketchUp SDK, which can't be downloaded in CI.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Look for unused files, exports and dependencies
        run: npm run knip
      - name: Type-check the shared code, the server and the browser tests
        run: npm run typecheck -w shared && npm run typecheck -w server && npx tsc --noEmit -p e2e
      - name: Test the shared code
        run: npm test -w shared
      - name: Test the server
        run: npm test -w server
      - name: Test the client
        run: npm test -w client
      - name: Type-check and build the client
        run: npm run build -w client

  e2e:
    # Opens the demo club in a headless Chromium, which renders in software.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Open the demo club in a browser
        run: npm run test:e2e
